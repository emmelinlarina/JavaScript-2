<!doctype html>
<html lang="en">
  <head>
    <title>Home Feed Page</title>
    <link rel="icon" type="image/png" sizes="32x32" href="" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Home Feed Page" />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <script
      src="https://kit.fontawesome.com/e0e8f3b90b.js"
      crossorigin="anonymous"
    ></script>

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body class="bg-zinc-50 text-zinc-900">
    <header></header>

    <main class="container feed mx-auto w-full max-w-6xl px-4">
      <h1
        class="feed-title flex justify-center mt-10 mx-auto text-lg sm:text-2xl font-bold"
      >
        Updates for you, <span data-greeting></span>
      </h1>

      <div class="feed-tabs flex justify-center mt-6 mb-4 sm:gap-4">
        <button
          class="chip is-active text-sm sm:text-xl cursor-pointer"
          data-filter="Recent"
        >
          Recent
        </button>
        <button
          class="chip text-sm sm:text-xl cursor-pointer"
          data-filter="Friends"
        >
          Friends
        </button>
        <button
          class="chip text-sm sm:text-xl cursor-pointer"
          id="discoverBtn"
          data-filter="Discover"
        >
          Discover+
        </button>
      </div>

      <p class="status" data-status></p>
      <section
        class="feed-list grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 items-stretch pb-28"
        data-feed
      ></section>
    </main>

    <footer></footer>

    <nav
      class="bottom-nav fixed bottom-0 left-0 right-0 bg-white border-t border-zinc-200 z-50 shadow-lg"
      role="navigation"
      aria-label="Primary"
    >
      <div
        class="max-w-4xl mx-auto grid grid-cols-5 items-center h-16 px-4 sm:px-6"
      >
        <a
          href="index.html"
          data-tab="home"
          aria-current="page"
          aria-label="Home"
          class="flex items-center justify-center text-zinc-900 hover:text-blue-500 transition"
        >
          <i class="fa-solid fa-house text-2xl" aria-hidden="true"></i>
        </a>
        <a
          href="#search"
          data-tab="search"
          aria-label="Search"
          class="flex items-center justify-center text-zinc-900 hover:text-blue-500 transition"
        >
          <i
            class="fa-solid fa-magnifying-glass text-2xl"
            aria-hidden="true"
          ></i>
        </a>
        <a
          href="post.html"
          id="openCreate"
          class="flex items-center justify-center -mt-4"
          aria-controls="createPost"
          aria-label="Create post"
        >
          <div
            class="text-zinc-800 mt-3 flex items-center justify-center transition"
          >
            <i
              class="fa-solid fa-plus text-zinc-900 text-2xl"
              aria-hidden="true"
            ></i>
          </div>
        </a>
        <a
          href="profile.html"
          data-tab="profile"
          aria-label="Profile"
          class="flex items-center justify-center text-zinc-900 hover:text-blue-500 transition"
        >
          <i class="fa-solid fa-circle-user text-2xl" aria-hidden="true"></i>
        </a>
        <button
          id="logoutBtn"
          aria-label="Log out"
          class="flex items-center justify-center text-zinc-900 hover:text-red-500 transition cursor-pointer"
        >
          <i
            class="fa-solid fa-right-from-bracket text-2xl"
            aria-hidden="true"
          ></i>
        </button>
      </div>
    </nav>

    <div id="modal-root" hidden></div>

    <script type="module" src="script/pages/feed.js"></script>
  </body>
</html>
